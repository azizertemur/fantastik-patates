name: YakınKilit Android APK
on:
  push:
    branches: [yakinkilit-demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reconstruct and verify source
        shell: bash
        run: |
          cat source/part-*.b64 | base64 -d > /tmp/yakinkilit-source.tar.xz
          echo "aaca2324fdcce4d25d5f66f8ae00833ba71dd1977c20c837403fbfc1b73e313c  /tmp/yakinkilit-source.tar.xz" | sha256sum -c -
          tar -xJf /tmp/yakinkilit-source.tar.xz
      - name: Use supported Kotlin Gradle Plugin
        run: |
          sed -i 's/version "2.1.20"/version "2.4.21"/' build.gradle.kts
          grep 'org.jetbrains.kotlin.android' build.gradle.kts
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 from runner
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Test and assemble debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YakinKilit-Demo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
